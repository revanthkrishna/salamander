<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Instrument Sans';src:url(../public/fonts/instrument-sans-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:'Instrument Serif';src:url(../public/fonts/instrument-serif-latin-400-italic.woff2);font-style:italic}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#14120D}
.logo{position:absolute;left:0;width:1280px;top:132px;transform:translateY(-50%);display:flex;justify-content:center}
.logo div{display:flex;align-items:center;gap:13px}
.logo img{width:100px;height:57.2px}
.logo span{font-family:'Instrument Serif';font-style:italic;font-size:80px;color:#FBF6EA;letter-spacing:-0.01em;line-height:1}
.win{position:absolute;left:0;top:258px;width:1600px;height:924px;transform-origin:0 0;transform:scale(0.8);border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 40px 120px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.07)}
.bar{position:absolute;left:0;top:0;width:1600px;height:44px;background:#ECECEF;border-bottom:1px solid #DADADF}
.dots{position:absolute;left:18px;top:15px;display:flex;gap:9px}.dots i{width:14px;height:14px;border-radius:7px}
.url{position:absolute;left:540px;top:8px;width:520px;height:28px;border-radius:9px;background:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-family:'Instrument Sans';font-size:15px;color:#3F3F46}
.ico{position:absolute;left:1560px;top:8px;width:28px;height:28px;border-radius:8px;background:#14120D;display:flex;align-items:center;justify-content:center}
.shot{position:absolute;left:0;top:44px;width:1600px;height:880px}
</style></head><body>
<div class="logo"><div><img src="../public/brand/logo.svg"><span>salamander</span></div></div>
<div class="win">
  <div class="bar"><div class="dots"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i></div>
  <div class="url"><svg width="11" height="13" viewBox="0 0 11 13"><rect x="1" y="5.5" width="9" height="7" rx="1.6" fill="#71717A"/><path d="M3 5.5V4a2.5 2.5 0 015 0v1.5" fill="none" stroke="#71717A" stroke-width="1.5"/></svg>orbit.example/pricing</div>
  <div class="ico"><img src="../public/brand/logo.svg" style="width:20px;height:11.4px"></div></div>
  <img class="shot" src="../public/take/t1/145.jpg">
</div></body></html>
