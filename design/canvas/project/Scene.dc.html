<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Themed scene</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Geist:wght@400..700&amp;family=Geist+Mono:wght@400;500&amp;family=Instrument+Serif:ital@0;1&amp;family=Instrument+Sans:wght@400..700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Figtree:wght@400..800&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 520px; height: 680px; display: flex; overflow: hidden; border-radius: {{r.lg}}px; background: {{t.pageBg}}; font-family: {{f.body}}; color: {{t.text}}; box-shadow: 0 0 0 1px {{t.line}};">
<div style="position: relative; width: 240px; height: 680px; flex-shrink: 0; overflow: hidden; padding: 20px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;">
<div style="height: 10px; width: 70px; border-radius: 5px; background: {{t.pageInk}}; opacity: 0.55;"></div>
<div style="height: 18px; width: 180px; border-radius: 6px; background: {{t.pageInk}}; margin-top: 18px;"></div>
<div style="height: 18px; width: 140px; border-radius: 6px; background: {{t.pageInk}};"></div>
<div style="height: 8px; width: 190px; border-radius: 4px; background: {{t.pageInk}}; opacity: 0.35; margin-top: 6px;"></div>
<div style="height: 8px; width: 160px; border-radius: 4px; background: {{t.pageInk}}; opacity: 0.35;"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 18px;">
<div style="height: 96px; border-radius: 10px; background: {{t.pageCard}};"></div>
<div style="height: 96px; border-radius: 10px; background: {{t.pageCard}};"></div>
</div>
<div style="height: 8px; width: 180px; border-radius: 4px; background: {{t.pageInk}}; opacity: 0.35; margin-top: 18px;"></div>
<div style="height: 8px; width: 150px; border-radius: 4px; background: {{t.pageInk}}; opacity: 0.35;"></div>
<div style="height: 8px; width: 170px; border-radius: 4px; background: {{t.pageInk}}; opacity: 0.35;"></div>
<div style="position: absolute; left: 12px; top: 108px; width: 214px; height: 92px; border-radius: {{r.md}}px; box-shadow: 0 0 0 2px {{t.accent}}, 0 0 0 3px {{t.keyline}}, 0 0 0 9999px {{t.scrim}};"></div>
<div role="dialog" aria-label="add feedback note" style="position: absolute; left: 12px; top: 212px; width: 216px; height: calc(126px - {{r.lg}}px); box-sizing: border-box; border-radius: {{r.lg}}px; box-shadow: 0 18px 40px rgba(0,0,0,0.28);">
<div style="position: absolute; left: 0; right: 0; top: 70px; bottom: 0; z-index: 0; box-sizing: border-box; border-radius: 0 0 {{r.lg}}px {{r.lg}}px; background: {{t.raised}}; padding: 6px; display: flex; align-items: center; gap: 8px;">
<span style="flex-grow: 1; padding: 0 6px; font-family: {{f.mono}}; font-size: 11px; color: {{t.muted}};"></span>
<button type="button" style="height: 30px; margin: 0; padding: 0 12px; border: none; border-radius: {{r.sm}}px; background: transparent; color: {{t.muted}}; font-family: {{f.body}}; font-size: 13px; font-weight: 500; cursor: pointer;">cancel</button>
<button type="button" style="height: 30px; margin: 0; padding: 0 12px; border: none; border-radius: {{r.sm}}px; background: transparent; color: {{t.accentInk}}; font-family: {{f.body}}; font-size: 13px; font-weight: 700; cursor: pointer;">save</button>
</div>
<textarea aria-label="note" placeholder="what should change here?" style="position: relative; z-index: 1; display: block; width: 100%; height: 84px; box-sizing: border-box; margin: 0; padding: 10px 12px; resize: none; border: 1px solid {{t.accent}}; border-radius: {{r.lg}}px; outline: none; background: {{t.surface}}; color: {{t.text}}; font-family: {{f.body}}; font-size: 13px; line-height: 1.4;">price should read per month, not per year.</textarea>
</div>
</div>
<aside aria-label="salamander sidebar" style="position: relative; z-index: 2; width: 280px; height: 680px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column; background: {{t.bg}}; border-left: 1px solid {{t.line}};">
<div style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 10px 0 16px; display: flex; align-items: center; gap: 10px;">
<img src="{{t.logoSrc}}" alt="" style="width: 35px; height: 20px; flex-shrink: 0; display: block;">
<span style="flex-grow: 1; font-family: {{f.display}}; font-style: {{f.displayStyle}}; font-size: {{f.wordSize}}px; font-weight: {{f.displayWeight}}; letter-spacing: -0.01em;">salamander</span>
<button type="button" aria-label="close sidebar" style="width: 32px; height: 32px; padding: 0; border: none; border-radius: {{r.btn}}px; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
<div style="flex-shrink: 0; padding: 4px 16px 16px; display: flex; gap: 8px;">
<div onMouseEnter="{{addEnter}}" onMouseLeave="{{addLeave}}" style="margin-right: auto; display: inline-flex; align-items: stretch; flex-shrink: 0; height: 36px; box-sizing: border-box; border: none; border-radius: {{r.btn}}px; overflow: hidden; background: {{t.accent}}; color: {{t.onAccent}}; font-family: {{f.body}};"><button type="button" aria-pressed="true" aria-label="add note" title="add note" style="width: 36px; height: 100%; margin: 0; padding: 0; border: none; background: transparent; color: inherit; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M20 14a2 2 0 0 1-2 2H8.5L4 19.5V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"></path></svg></button><sc-if value="{{showKeepOn}}" hint-placeholder-val="{{true}}"><button type="button" role="switch" aria-checked="{{keepOn}}" aria-label="keep add mode on" title="keep add mode on" onClick="{{toggleKeepOn}}" style="height: 100%; margin: 0; padding: 0 10px; border: none; border-left: 1px solid {{keepDivider}}; background: {{keepBg}}; color: {{keepFg}}; box-shadow: {{keepEdge}}; flex-shrink: 0; display: flex; align-items: center; cursor: pointer; transition: background-color 140ms ease;"><span style="position: relative; width: 28px; height: 16px; border-radius: 8px; flex-shrink: 0; transition: background-color 140ms ease; background: {{keepTrack}};"><span style="position: absolute; top: 2px; left: {{keepKnobLeft}}; width: 12px; height: 12px; border-radius: 50%; background: {{t.surface}}; transition: left 140ms ease;"></span></span></button></sc-if></div>
<div style="position: relative; display: inline-flex; align-items: stretch; flex-shrink: 0; height: 36px; box-sizing: border-box; border: 1px solid {{t.line}}; border-radius: {{r.btn}}px; background: {{t.surface}}; color: {{t.text}};"><button type="button" aria-label="export feedback" title="export feedback" style="width: 36px; height: 100%; margin: 0; padding: 0; border: none; border-radius: 9px 0 0 9px; background: transparent; color: inherit; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"></path></svg></button><button type="button" aria-label="more actions" aria-expanded="{{menuOpen}}" title="more actions" onClick="{{toggleMenu}}" style="width: 22px; height: 100%; margin: 0; padding: 0; border: none; border-left: 1px solid {{t.line}}; border-radius: 0 9px 9px 0; background: {{menuChevBg}}; color: {{t.muted}}; flex-shrink: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="{{menuChevPath}}"></path></svg></button><sc-if value="{{menuOpen}}" hint-placeholder-val="{{true}}"><div role="menu" style="position: absolute; top: 42px; right: 0; min-width: 132px; padding: 4px; box-sizing: border-box; border-radius: {{r.md}}px; border: 1px solid {{t.line}}; background: {{t.surface}}; box-shadow: 0 18px 40px rgba(0,0,0,0.28); display: flex; flex-direction: column; gap: 2px; z-index: 3;"><button type="button" role="menuitem" style="height: 32px; margin: 0; padding: 0 10px; border: none; border-radius: {{r.sm}}px; background: transparent; color: {{t.text}}; font-family: {{f.body}}; font-size: 13px; font-weight: 500; white-space: nowrap; display: flex; align-items: center; gap: 8px; cursor: pointer;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 19h14"></path></svg>import</button></div></sc-if></div>
</div>
<h2 style="flex-shrink: 0; margin: 0; padding: 0 16px 10px; font-size: 12px; font-weight: 600; color: {{t.muted}};">this page (3)</h2>
<ul onMouseLeave="{{clearHover}}" style="list-style: none; margin: 0; padding: 0 16px; display: flex; flex-direction: column; gap: 16px;">
<sc-for list="{{items}}" as="item" hint-placeholder-count="3">
<li style="position: relative; z-index: {{item.z}}; transform-origin: right center; transition: transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1); transform: {{item.transform}};">
<button type="button" aria-label="feedback item {{item.n}}" onMouseEnter="{{item.enter}}" onFocus="{{item.enter}}" style="position: relative; width: 100%; margin: 0; padding: 0; border: none; background: transparent; color: {{t.text}}; font: inherit; text-align: left; display: flex; flex-direction: column; gap: 8px; cursor: pointer; outline: none;">
<div style="position: relative; z-index: 2; width: 100%; height: 100px; border-radius: {{r.md}}px; overflow: hidden; background: {{t.pageCard}}; display: flex; align-items: center; justify-content: center;">
<div style="width: {{item.iw}}px; height: {{item.ih}}px; border-radius: 6px; background: {{t.pageBg}}; display: flex; flex-direction: column; gap: 6px; padding: 12px; box-sizing: border-box;"><div style="height: 8px; width: 50%; border-radius: 4px; background: {{t.pageInk}};"></div><div style="height: 6px; width: 85%; border-radius: 3px; background: {{t.pageInk}}; opacity: 0.35;"></div></div>
<span style="position: absolute; top: 8px; left: 8px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 6px; border-radius: {{r.sm}}px; background: {{t.accent}}; color: {{t.onAccent}}; font-family: {{f.mono}}; font-size: 11px; font-weight: 600; line-height: 20px; text-align: center;">{{item.n}}</span>
</div>
<div style="position: absolute; left: 0; right: 0; top: {{item.extTop}}px; bottom: 0; z-index: 0; border-radius: 0 0 {{r.md}}px {{r.md}}px; background: {{item.noteBg}}; box-shadow: {{item.noteShadow}}; opacity: {{item.noteOpacity}}; transition: opacity 200ms ease; pointer-events: none;"></div>
<p style="position: relative; z-index: 1; margin: 0; padding: 8px 10px; font-size: 13px; line-height: 1.4; background: transparent; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">{{item.note}}</p>
</button>
</li>
</sc-for>
</ul>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"t":{"editor":null},"f":{"editor":null},"r":{"editor":null},"$preview":{"width":520,"height":680}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { hover: 1, addHover: false, keepOn: false, menuOpen: false };
}
renderVals() {
const t = this.props.t ?? {
pageBg: '#FFFFFF', pageInk: '#2B2A27', pageCard: '#EDEAE3', bg: '#FFFCF5', surface: '#FFFFFF', raised: '#F6F1E4',
line: '#EAE3D2', text: '#1A1712', muted: '#6E6656', accent: '#FEC800', accentSoft: 'rgba(254,200,0,0.30)', accentInk: '#1A1712',
onAccent: '#1A1712', keyline: 'rgba(26,23,18,0.55)', scrim: 'rgba(26,23,18,0.42)', logoSrc: '/_blob/a9c852774105e097a5bd14c898d8a1a3'
};
const f = this.props.f ?? {
display: "'Instrument Serif', serif", body: "'Instrument Sans', sans-serif", mono: "'JetBrains Mono', monospace",
displayStyle: 'italic', displayWeight: 400, wordSize: 22
};
const r = this.props.r ?? { sm: 6, md: 10, lg: 14, btn: 10 };
const notes = [
{ note: 'logo looks blurry on retina screens. swap in the svg version.', iw: 170, ih: 64 },
{ note: 'price should read per month, not per year. also the popular badge overlaps the plan title on narrow screens, and the card border is thicker than its neighbours.', iw: 100, ih: 68 },
{ note: 'hero cta wraps onto two lines at 1024px wide. keep it on one line.', iw: 200, ih: 44 }
];
const h = this.state.hover;
const items = notes.map((it, i) => {
const d = h === null || h === undefined ? 9 : Math.abs(i - h);
const scale = d === 0 ? 1.12 : d === 1 ? 1.05 : 1;
const tx = d === 0 ? -22 : d === 1 ? -8 : 0;
return {
...it,
n: i + 1,
z: d === 0 ? 3 : d === 1 ? 2 : 1,
transform: 'translateX(' + tx + 'px) scale(' + scale + ')',
extTop: 100 - r.md,
noteBg: d === 0 ? t.surface : 'transparent',
noteShadow: d === 0 ? '0 10px 28px rgba(0,0,0,0.18), inset 0 0 0 1px ' + t.line : 'none',
noteOpacity: d === 0 ? 1 : 0,
enter: () => this.setState({ hover: i })
};
});
const keepOn = this.state.keepOn;
return {
t, f, r, items,
clearHover: () => this.setState({ hover: null }),
keepOn,
showKeepOn: keepOn || this.state.addHover,
keepTrack: keepOn ? t.onAccent : t.lineStrong ?? t.line,
keepBg: keepOn ? t.accent : t.surface,
keepFg: keepOn ? t.onAccent : t.text,
keepDivider: keepOn ? 'rgba(26,23,18,0.25)' : t.line,
keepEdge: keepOn ? 'none' : 'inset 0 0 0 1px ' + t.line,
keepKnobLeft: keepOn ? '14px' : '2px',
addEnter: () => this.setState({ addHover: true }),
addLeave: () => this.setState({ addHover: false }),
toggleKeepOn: () => this.setState({ keepOn: !this.state.keepOn }),
menuOpen: this.state.menuOpen,
menuChevBg: this.state.menuOpen ? t.hover ?? t.raised : 'transparent',
menuChevPath: this.state.menuOpen ? 'M6 15l6-6 6 6' : 'M6 9l6 6 6-6',
toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen })
};
}
}
</script>
</body>
</html>
