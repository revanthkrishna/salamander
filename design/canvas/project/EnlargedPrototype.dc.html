<div style="width: 96px; height: 12px; border-radius: 6px; background: {{t.pageInk}};"></div>
<div style="flex-grow: 1;"></div>
<div style="width: 60px; height: 9px; border-radius: 5px; background: {{t.pageInk}}; opacity: 0.4;"></div>
<div style="width: 60px; height: 9px; border-radius: 5px; background: {{t.pageInk}}; opacity: 0.4;"></div>
<div style="width: 60px; height: 9px; border-radius: 5px; background: {{t.pageInk}}; opacity: 0.4;"></div>

<div style="display: flex; gap: 20px; padding: 64px 48px 0;">
<div style="width: 330px; height: 280px; border-radius: 14px; background: {{t.pageCard}}; padding: 26px; box-sizing: border-box;"><div style="width: 80px; height: 12px; border-radius: 6px; background: {{t.pageInk}};"></div><div style="width: 130px; height: 26px; border-radius: 8px; background: {{t.pageInk}}; margin-top: 20px;"></div><div style="width: 220px; height: 8px; border-radius: 4px; background: {{t.pageInk}}; opacity: 0.3; margin-top: 26px;"></div><div style="width: 190px; height: 8px; border-radius: 4px; background: {{t.pageInk}}; opacity: 0.3; margin-top: 10px;"></div><div style="width: 100%; height: 40px; border-radius: 10px; background: {{t.pageInk}}; opacity: 0.85; margin-top: 60px;"></div></div>
<div style="width: 330px; height: 280px; border-radius: 14px; background: {{t.pageCard}}; padding: 26px; box-sizing: border-box; box-shadow: inset 0 0 0 2px {{t.accent}};"><div style="width: 80px; height: 12px; border-radius: 6px; background: {{t.pageInk}};"></div><div style="width: 130px; height: 26px; border-radius: 8px; background: {{t.pageInk}}; margin-top: 20px;"></div><div style="width: 220px; height: 8px; border-radius: 4px; background: {{t.pageInk}}; opacity: 0.3; margin-top: 26px;"></div><div style="width: 190px; height: 8px; border-radius: 4px; background: {{t.pageInk}}; opacity: 0.3; margin-top: 10px;"></div><div style="width: 100%; height: 40px; border-radius: 10px; background: {{t.accent}}; margin-top: 60px;"></div></div>
<div style="width: 330px; height: 280px; border-radius: 14px; background: {{t.pageCard}}; padding: 26px; box-sizing: border-box;"><div style="width: 80px; height: 12px; border-radius: 6px; background: {{t.pageInk}};"></div><div style="width: 130px; height: 26px; border-radius: 8px; background: {{t.pageInk}}; margin-top: 20px;"></div><div style="width: 220px; height: 8px; border-radius: 4px; background: {{t.pageInk}}; opacity: 0.3; margin-top: 26px;"></div><div style="width: 190px; height: 8px; border-radius: 4px; background: {{t.pageInk}}; opacity: 0.3; margin-top: 10px;"></div><div style="width: 100%; height: 40px; border-radius: 10px; background: {{t.pageInk}}; opacity: 0.85; margin-top: 60px;"></div></div>
</div>
</div>


<div aria-hidden="true" onClick="{{close}}" style="position: absolute; left: 0; top: 0; width: 1440px; height: 900px; background: {{t.scrim}}; opacity: {{scrim.opacity}}; pointer-events: {{scrim.pe}}; transition: {{scrim.trans}};"></div>

<aside aria-label="salamander sidebar" onKeyDown="{{onPanelKey}}" style="position: absolute; top: 0; right: 0; height: 900px; width: {{panel.w}}; box-sizing: border-box; overflow: hidden; background: {{t.bg}}; border-left: 1px solid {{t.line}}; transition: {{panel.trans}};">

<div style="position: absolute; top: 0; right: 0; width: 299px; height: 900px; display: flex; flex-direction: column; opacity: {{list.opacity}}; pointer-events: {{list.pe}}; transition: {{list.trans}};">
<div style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 0 10px 0 16px; display: flex; align-items: center; justify-content: flex-end; gap: 2px;">
<button type="button" aria-label="theme: {{themeName}}" title="theme: {{themeName}}" style="width: 32px; height: 32px; padding: 0; border: none; border-radius: {{r.md}}px; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none"></path></svg></button>
<button type="button" aria-label="close sidebar" style="width: 32px; height: 32px; padding: 0; border: none; border-radius: {{r.md}}px; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="height: 56px; flex-shrink: 0; box-sizing: border-box; padding: 4px 16px 16px; display: flex; gap: 8px;">
<button type="button" aria-pressed="false" aria-label="add feedback" style="flex-grow: 1; height: 36px; border: 1px solid {{t.line}}; border-radius: {{r.md}}px; background: {{t.surface}}; color: {{t.text}}; font-family: {{f.body}}; font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>add note</button>
<button type="button" aria-label="export feedback" style="width: 36px; height: 36px; padding: 0; border-radius: {{r.md}}px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"></path></svg></button>
<button type="button" aria-label="import feedback" style="width: 36px; height: 36px; padding: 0; border-radius: {{r.md}}px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer;"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 19h14"></path></svg></button>
</div>
<sc-if value="{{hasNotes}}" hint-placeholder-val="{{true}}">
<h2 style="flex-shrink: 0; height: 26px; box-sizing: border-box; margin: 0; padding: 0 16px 10px; font-size: 12px; line-height: 16px; font-weight: 600; color: {{t.muted}};">this page ({{count}})</h2>
<div id="sm-list" class="sm-scroll" style="position: relative; flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 0 16px 24px;">
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px;">
<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<li id="{{item.domId}}" style="position: relative; z-index: {{item.z}};">
<button type="button" aria-label="{{item.aria}}" onClick="{{item.open}}" onMouseEnter="{{item.enter}}" onMouseLeave="{{item.leave}}" onFocus="{{item.enter}}" onBlur="{{item.leave}}" style="width: 100%; height: 178px; margin: 0; padding: 0; border: none; background: transparent; color: {{t.text}}; font: inherit; text-align: left; display: flex; flex-direction: column; gap: 8px; cursor: pointer; outline: none; transform-origin: right center; transform: {{item.transform}}; transition: {{item.trans}};">
<div style="position: relative; flex-shrink: 0; width: 100%; height: 100px; border-radius: {{r.md}}px; overflow: hidden; background: {{t.raised}}; display: flex; align-items: center; justify-content: center; visibility: {{item.thumbVis}};">
<div style="position: relative; flex-shrink: 0; width: {{item.shot.w}}; height: {{item.shot.h}}; border-radius: {{item.shot.r}}; background: {{t.pageBg}}; overflow: hidden;"><sc-for list="{{item.shot.blocks}}" as="b" hint-placeholder-count="6"><div style="position: absolute; left: {{b.l}}; top: {{b.t}}; width: {{b.w}}; height: {{b.h}}; border-radius: {{b.r}}; background: {{b.bg}}; opacity: {{b.o}};"></div></sc-for></div>
<span style="position: absolute; top: 8px; left: 8px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 6px; border-radius: {{r.sm}}px; background: {{t.accent}}; color: {{t.onAccent}}; font-family: {{f.mono}}; font-size: 11px; font-weight: 600; line-height: 20px; text-align: center;">{{item.n}}</span>
</div>
<p style="flex-shrink: 0; height: 70px; box-sizing: border-box; margin: 0; padding: 8px 10px; border-radius: {{r.md}}px; font-size: 13px; line-height: 18px; background: {{item.noteBg}}; box-shadow: {{item.noteShadow}}; transition: {{item.noteTrans}}; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">{{item.text}}</p>
</button>
</li>
</sc-for>
</ul>
</div>
</sc-if>
<sc-if value="{{noNotes}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 80px 24px 0; text-align: center; font-size: 13px; color: {{t.muted}};">no feedback on this page yet</p>
</sc-if>
</div>

<div style="position: absolute; z-index: 2; top: 0; left: 0; height: 56px; box-sizing: border-box; padding: 0 0 0 16px; display: flex; align-items: center; gap: 10px; pointer-events: none;">
<img src="{{t.logoSrc}}" alt="" style="width: 35px; height: 20px; flex-shrink: 0; display: block;">
<span style="font-family: {{f.display}}; font-style: italic; font-size: 22px; font-weight: 400; letter-spacing: -0.01em; color: {{t.text}}; white-space: nowrap;">salamander</span>
</div>

<sc-if value="{{showEnl}}" hint-placeholder-val="{{false}}">
<div role="region" aria-label="enlarged note" style="position: absolute; top: 0; right: 0; width: 1079px; height: 900px; pointer-events: none;">

<div style="position: absolute; left: 150px; top: 152px; width: 720px; height: 34px; display: flex; align-items: baseline; gap: 12px; opacity: {{aTitle.o}}; transition: {{aTitle.trans}};">
<h2 style="margin: 0; font-family: {{f.display}}; font-style: italic; font-weight: 400; font-size: 28px; line-height: 34px; letter-spacing: -0.01em; color: {{t.text}};">feedback #{{cur.n}}</h2>
<span style="font-family: {{f.mono}}; font-size: 12px; color: {{t.muted}};">{{cur.n}} / {{count}}</span>
</div>

<div style="position: absolute; left: 150px; top: 594px; width: 720px; display: flex; flex-direction: column; pointer-events: {{enl.pe}}; opacity: {{aEditor.o}}; transition: {{aEditor.trans}};">
<textarea aria-label="note" placeholder="what should change here?" value="{{cur.draft}}" onChange="{{onDraft}}" onFocus="{{taFocus}}" onBlur="{{taBlur}}" onMouseEnter="{{taEnter}}" onMouseLeave="{{taLeave}}" style="position: relative; z-index: 1; display: block; width: 100%; height: 96px; box-sizing: border-box; margin: 0; padding: 12px 14px; resize: none; border: 1px solid {{cur.taBorder}}; border-radius: {{r.lg}}px; outline: none; background: {{t.surface}}; color: {{t.text}}; font-family: {{f.body}}; font-size: 14px; line-height: 1.45; transition: {{cur.taTrans}};">{{cur.draft}}</textarea>
<div style="position: relative; z-index: 0; height: 62px; margin-top: -14px; padding: 22px 8px 8px 8px; box-sizing: border-box; background: {{t.raised}}; border-radius: 0 0 {{r.lg}}px {{r.lg}}px; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
<button type="button" aria-label="delete note" onClick="{{del}}" onMouseEnter="{{bDel.enter}}" onMouseLeave="{{bDel.leave}}" onMouseDown="{{bDel.down}}" onMouseUp="{{bDel.up}}" style="height: 32px; margin: 0; padding: 0 12px; border: none; border-radius: {{r.md}}px; background: {{bDel.bg}}; color: {{t.danger}}; font-family: {{f.body}}; font-size: 13px; font-weight: 600; cursor: pointer; transform: {{bDel.transform}}; transition: {{bDel.trans}};">delete</button>
<span role="status" aria-live="polite" style="display: flex; align-items: center; gap: 4px; padding: 0 10px; font-size: 12px; color: {{t.muted}}; opacity: {{saved.o}}; transition: {{saved.trans}};"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{saved.label}}</span>
</div>
</div>

<div style="position: absolute; left: 890px; top: 152px; display: flex; flex-direction: column; gap: 8px; pointer-events: {{enl.pe}}; opacity: {{aRail.o}}; transition: {{aRail.trans}};">
<button type="button" id="sm-exit" aria-label="exit enlarged view" title="exit enlarged view (esc)" onClick="{{close}}" onMouseEnter="{{bX.enter}}" onMouseLeave="{{bX.leave}}" onMouseDown="{{bX.down}}" onMouseUp="{{bX.up}}" style="width: 40px; height: 40px; margin: 0 0 8px; padding: 0; box-sizing: border-box; border: 1px solid {{bX.border}}; border-radius: {{r.md}}px; background: {{bX.bg}}; color: {{t.text}}; display: flex; align-items: center; justify-content: center; cursor: pointer; transform: {{bX.transform}}; transition: {{bX.trans}};"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<button type="button" aria-label="previous note" title="previous note (↑)" aria-disabled="{{bUp.disabled}}" onClick="{{goPrev}}" onMouseEnter="{{bUp.enter}}" onMouseLeave="{{bUp.leave}}" onMouseDown="{{bUp.down}}" onMouseUp="{{bUp.up}}" style="width: 40px; height: 40px; margin: 0; padding: 0; box-sizing: border-box; border: 1px solid {{bUp.border}}; border-radius: {{r.md}}px; background: {{bUp.bg}}; color: {{t.text}}; opacity: {{bUp.opacity}}; display: flex; align-items: center; justify-content: center; cursor: {{bUp.cursor}}; transform: {{bUp.transform}}; transition: {{bUp.trans}};"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
<button type="button" aria-label="next note" title="next note (↓)" aria-disabled="{{bDown.disabled}}" onClick="{{goNext}}" onMouseEnter="{{bDown.enter}}" onMouseLeave="{{bDown.leave}}" onMouseDown="{{bDown.down}}" onMouseUp="{{bDown.up}}" style="width: 40px; height: 40px; margin: 0; padding: 0; box-sizing: border-box; border: 1px solid {{bDown.border}}; border-radius: {{r.md}}px; background: {{bDown.bg}}; color: {{t.text}}; opacity: {{bDown.opacity}}; display: flex; align-items: center; justify-content: center; cursor: {{bDown.cursor}}; transform: {{bDown.transform}}; transition: {{bDown.trans}};"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>

</div>

<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; opacity: {{cardsLayer.o}}; transition: {{cardsLayer.trans}};">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
<button type="button" aria-label="{{c.aria}}" aria-hidden="{{c.ariaHidden}}" tabindex="{{c.tab}}" title="{{c.title}}" onClick="{{c.click}}" onMouseEnter="{{c.enter}}" onMouseLeave="{{c.leave}}" onFocus="{{c.focus}}" onBlur="{{c.blur}}" style="position: absolute; right: {{c.right}}; top: {{c.top}}; width: {{c.w}}; height: {{c.h}}; z-index: {{c.z}}; margin: 0; padding: 0; border: none; background: transparent; color: {{t.text}}; font: inherit; text-align: left; cursor: pointer; outline: none; opacity: {{c.op}}; pointer-events: {{c.pe}}; transition: {{c.trans}};">
<div class="sm-rm-still" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform: {{c.lift}}; transition: {{c.liftTrans}};">
<div style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: {{r.md}}px; overflow: hidden; background: {{t.raised}}; display: flex; align-items: center; justify-content: center; box-shadow: {{c.ring}};">
<div style="position: relative; flex-shrink: 0; width: {{c.shot.w}}; height: {{c.shot.h}}; border-radius: {{c.shot.r}}; background: {{t.pageBg}}; overflow: hidden; transition: {{c.shotTrans}};"><sc-for list="{{c.shot.blocks}}" as="b" hint-placeholder-count="6"><div style="position: absolute; left: {{b.l}}; top: {{b.t}}; width: {{b.w}}; height: {{b.h}}; border-radius: {{b.r}}; background: {{b.bg}}; opacity: {{b.o}};"></div></sc-for></div>
<span style="position: absolute; top: 8px; left: 8px; min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 6px; border-radius: {{r.sm}}px; background: {{t.accent}}; color: {{t.onAccent}}; font-family: {{f.mono}}; font-size: 11px; font-weight: 600; line-height: 20px; text-align: center; opacity: {{c.badgeO}}; transition: {{c.badgeT}};">{{c.n}}</span>
</div>
<p style="position: absolute; left: 0; right: 0; top: calc(100% + 8px); margin: 0; padding: 0 10px; font-size: 13px; line-height: 18px; color: {{t.text}}; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; opacity: {{c.capO}}; transition: {{c.capT}};">{{c.text}}</p>
</div>
</button>
</sc-for>
</div>
</sc-if>

</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"motion":{"editor":"enum","options":["normal","slow (4x)"],"default":"normal"},"$preview":{"width":1440,"height":900}}'>
